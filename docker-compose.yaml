services:
  db:
    image: postgis/postgis:18-3.6
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/postgres_db
      - ./dump4.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - app-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      

  backend:
    build: ./app/backend
    container_name: backend_app
    restart: always
    env_file: prod1.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /origin
    networks:
      - app-network
  
  frontend:
    build: ./app/frontend/nuxt-app-v2
    container_name: frontend_app
    restart: always
    
    ports:
      - "3000:3000"
    environment:
    - NUXT_PUBLIC_API_BASE=http://backend:8000
    - NUXT_PUBLIC_API_NOTBASE=http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network
      
  nginx:
    image: nginx:latest
    container_name: nginx_app
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
    - app-network
    
networks:
  app-network:
    driver: bridge


volumes:
  db_data: