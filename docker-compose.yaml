services:
  db:
    image: postgis/postgis:18-3.6
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/postgres_db
      - ./db_backup.dump:/backup/bd_dump.dump
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - app-network
    environment:
      POSTGRES_DB: diplom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: backend_app
    restart: always
    env_file: prod.env
    depends_on:
      - db
    ports:
      - "8000:8000"  
    environment:
      PYTHONPATH: /origin
    networks:
      - app-network

  frontend:
    build: ./app/frontend/nuxt-app-v2
    container_name: frontend_app
    restart: always
    ports:
      - "3000:3000" 
    environment:
      
      NUXT_API_BASE: http://nginx_app/apiback
      NUXT_PUBLIC_API_BASE: http://localhost/apiback  
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_app
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend 
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: